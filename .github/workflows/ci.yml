name: CI - Calidad de los juegos

# Se ejecuta en cada push y pull request. Corre el mismo script que se usa en local: quality/run-local.sh
on:
  push:
    branches: [feature/tpcalidad]
  pull_request:
    branches: [feature/tpcalidad]
  workflow_dispatch:

jobs:
  calidad:
    name: Compilación, pruebas, cobertura, análisis estático y quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Node 20 (jscpd)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inyectar defecto (demostración del gate: solo si el commit dice [demo-fallo])
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[demo-fallo]') }}
        run: sed -i 's/Fallos >= FallosParaPista/Fallos > FallosParaPista/' "My project/Assets/_Scripts/Comun/Logica/RondaDeOpciones.cs"

      - name: Pipeline de calidad (quality/run-local.sh)
        run: bash quality/run-local.sh

      - name: Publicar reportes (cobertura HTML, SARIF, duplicación, resultados de pruebas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: quality/out/
          retention-days: 30
